services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: spoonfuls
      POSTGRES_USER: spoonfuls
    entrypoint: ["/usr/local/bin/spoonfuls-postgres"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-secret:/run/spoonfuls
      - ./docker/postgres-entrypoint.sh:/usr/local/bin/spoonfuls-postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoonfuls -d spoonfuls"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    environment:
      SPOONFULS_AUTO_MIGRATE: "1"
    ports:
      - "${SPOONFULS_PORT:-8900}:8000"
    volumes:
      - postgres-secret:/run/spoonfuls:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  postgres-secret:
